name: Something doesn't work
description: Report a bug or an error message.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Before you start, have a look at [Troubleshooting](https://github.com/Self-hosted-MCP/Shared-Browser-MCP/blob/main/docs/troubleshooting.md): many problems have a quick fix there.

        **Security problem?** Don't post it here. Use [private reporting](https://github.com/Self-hosted-MCP/Shared-Browser-MCP/security/advisories/new) instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: This page is public. Anyone can read it.
      options:
        - label: I removed passwords, keys, tokens and private data from everything below.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the exact message, if there was one. Logs from your hosting company or terminal help too.
      render: text
  - type: dropdown
    id: how
    attributes:
      label: How do you run it?
      options:
        - My own server, docker-compose.server.yml (ready-made images)
        - My own server, built from the folders
        - A server panel such as Coolify
        - On my computer, to try it (docker-compose.local.yml)
        - Something else
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which AI app?
      multiple: true
      options:
        - Claude (website or phone)
        - Claude Desktop
        - Claude Code
        - Codex
        - ChatGPT
        - Cursor
        - VS Code
        - Gemini CLI
        - Something else
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 on ARM, Debian 12 on Intel ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Ask your AI app to run the `health` tool, or look at the release you installed. Otherwise the date you last pulled the images.
      placeholder: 0.1.0
