# Publishes the six ready-made images to ghcr.io/self-hosted-mcp/shared-browser-* for each release, for amd64 and arm64.
# Tags: the version (0.1.0), major.minor (0.1) and latest. Each image carries provenance and an SBOM.
# Only official releases are built, never unreleased code. Runs only in the original project, not in forks.
name: images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, like v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Self-hosted-MCP/Shared-Browser-MCP'
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # the browser image for two chip types takes the longest
    permissions:
      contents: read
      packages: write   # to publish the images
    strategy:
      fail-fast: false
      matrix:
        svc: [dns, searxng, egress, browser, front, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0, pinned
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1, pinned
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0, pinned
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0, pinned
        with:
          images: ghcr.io/self-hosted-mcp/shared-browser-${{ matrix.svc }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Shared-Browser-MCP ${{ matrix.svc }}
            org.opencontainers.image.description=Private search, page reader and a shared Chrome for your AI app.
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0, pinned
        with:
          context: ./${{ matrix.svc }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
