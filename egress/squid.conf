# The browser's only way out. It refuses every private address, so a web page can't reach the server's inside.
http_port 3128
acl wall_net src 10.88.250.0/24
acl Safe_ports port 80 443 1025-65535
acl CONNECT_ok port 443 1025-65535
acl CONNECT method CONNECT

acl private_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3
acl private_v6 dst ::1 fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96
acl blocked_sites dstdomain "/etc/squid/blocked_sites.txt"
acl blocked_ips dst "/etc/squid/blocked_ips.txt"   # the server's own public address, from SERVER_PUBLIC_IP (start.sh)

http_access deny !wall_net
http_access deny private_v4
http_access deny private_v6
http_access deny blocked_sites
http_access deny blocked_ips
http_access deny !Safe_ports
http_access deny CONNECT !CONNECT_ok
http_access allow wall_net
http_access deny all

# no history: nothing cached, nothing logged
cache deny all
access_log none
cache_log /dev/null
forwarded_for delete
