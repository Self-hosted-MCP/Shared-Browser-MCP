[project]
name = "shared-browser-mcp"
version = "0.1.0"
description = "Private MCP: search (SearXNG), read pages and PDFs, and drive a shared Chromium."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "playwright>=1.49",
    "websockets>=13",
    "python-multipart>=0.0.20",
    "PyJWT[crypto]>=2.9",
]

[project.scripts]
shared-browser-mcp = "sbmcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbmcp"]
