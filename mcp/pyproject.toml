[project]
name = "shared-browser-mcp"
version = "0.1.0"
description = "Private MCP: search (SearXNG), read pages and PDFs, and drive a shared Chromium."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "self-hosted", "searxng", "browser", "chromium", "privacy", "ai-agents"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "playwright>=1.49",
    "websockets>=13",
    "python-multipart>=0.0.20",
    "PyJWT[crypto]>=2.9",
]

[project.urls]
Homepage = "https://github.com/Self-hosted-MCP/Shared-Browser-MCP"
Documentation = "https://github.com/Self-hosted-MCP/Shared-Browser-MCP/tree/main/docs"
Issues = "https://github.com/Self-hosted-MCP/Shared-Browser-MCP/issues"
Changelog = "https://github.com/Self-hosted-MCP/Shared-Browser-MCP/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
shared-browser-mcp = "sbmcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbmcp"]
