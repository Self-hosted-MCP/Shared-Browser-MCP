map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  root /usr/share/nginx/html;
  access_log off;
  error_log /dev/stderr warn;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  resolver 127.0.0.11 valid=10s;

  # Every request, including the live view and the search page, must carry Cloudflare Zero Trust's signed token.
  # The app checks it (access.py). Off on a Mac (ACCESS_ENFORCE=0), where this always answers yes.
  auth_request /_auth;
  location = /_auth {
    internal;
    set $auth_up http://mcp:8766;   # its own variable name: a subrequest shares variables with the request that asked
    proxy_pass $auth_up/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
  }

  # Text is sent compressed. Pages (and the files that restyle SearXNG) are re-checked on every load; the large static files
  # of the live view and of SearXNG are kept by the browser for an hour or a day.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  location = /live/package.json {   # noVNC asks for it; answer instead of a 404
    default_type application/json;
    expires 1d;
    return 200 '{"name":"novnc"}';
  }

  location = / {
    expires -1;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /index.html =404;
  }
  location / { expires -1; try_files $uri =404; }

  location /search/static/ {
    set $up http://searxng:8080;
    proxy_pass $up;
    proxy_set_header Host $http_host;
    proxy_set_header X-Script-Name /search;
    proxy_hide_header Cache-Control;
    expires 1d;
  }

  location /search/ {
    set $up http://searxng:8080;
    proxy_pass $up;
    proxy_set_header Host $http_host;
    proxy_set_header X-Script-Name /search;
    # Swap SearXNG's footer for what the user wants to see (the page's own files, served by this nginx; SearXNG is not changed).
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/sb-status.css?v=4"><script src="/sb-status.js?v=4" defer></script></head>';
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    # One user, settings fixed in settings.yml: never pass cookies on. Another app on the same host (e.g. localhost) can leave
    # a cookie such as theme=dark that SearXNG rejects with "Invalid settings".
    proxy_set_header Cookie "";
  }
  location /api/ {
    client_max_body_size 60m;
    proxy_read_timeout 120s;   # the self-test can take a while when something is broken
    set $up http://mcp:8766;
    proxy_pass $up;
    proxy_set_header Host $http_host;
  }
  location /live/ {
    set $up http://browser:6080;
    rewrite ^/live/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    expires 1h;   # only applies to normal files; the websocket is unaffected
  }
}

# For the shared browser only (port 8088, not published; reachable on the wall network). Same look and cookie rule as /search/,
# but no Zero Trust check (the browser has no token). The footer reads /sb-footer.json instead of the admin API.
server {
  listen 8088;
  root /usr/share/nginx/html;
  access_log off;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=10s;
  gzip on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  location = /sb-status.css { expires -1; }
  location = /sb-status.js { expires -1; }
  location = /sb-footer.json {   # the connection facts, without Zero Trust: this port is only reachable on the wall network
    set $up http://mcp:8766;
    proxy_pass $up/wall/footer;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
  }
  location /static/ {
    set $up http://searxng:8080;
    proxy_pass $up;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_hide_header Cache-Control;
    expires 1d;
  }
  location / {
    set $up http://searxng:8080;
    proxy_pass $up;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/sb-status.css?v=4"><script src="/sb-status.js?v=4" data-src="/sb-footer.json" defer></script></head>';
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    proxy_set_header Cookie "";
  }
}
